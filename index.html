  .beyt { line-height: 2.1; }

  @media (max-width: 640px) {
    .beyt-grid { grid-template-columns: 1fr; text-align: center; row-gap: 0.25rem; }
    .beyt-grid .mesra-1, .beyt-grid .mesra-2 { text-align: center; }

  /* center-flow layout for masnavi / rubaiyat where each hemistich stacks */

  .pt-safe { padding-top: max(env(safe-area-inset-top), 0.5rem); }

<body class="theme-sepia">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ─────────────────────────────────────────────────────────────────────────
   PERSIAN TEXT NORMALIZATION (two-layer per the blueprint)
   ──────────────────────────────────────────────────────────────────────── */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const TO_FA = { 'ي': 'ی', 'ك': 'ک', 'ى': 'ی', 'ة': 'ه', 'ہ': 'ه' };
const DIAC = /[ً-ْٰـٕٔ]/g;
const BIDI = /[‎‏‪-‮⁦-⁩]/g;

function toDisplay(s) {
  return (s || '').normalize('NFC')
    .replace(/[يكىةہ]/g, c => TO_FA[c] || c)
    .replace(BIDI, '');
}
function toSearch(s) {
  let x = toDisplay(s).replace(DIAC, '')
    .replace(/[آأإ]/g, 'ا')
    .replace(/[ؤئء]/g, '')
    .replace(/[‌‍]/g, ' ');
  for (let i = 0; i < 10; i++) {
    x = x.replace(new RegExp(FA_DIGITS[i], 'g'), String(i));
    x = x.replace(new RegExp(AR_DIGITS[i], 'g'), String(i));
  }
  return x.toLowerCase().replace(/\s+/g, ' ').trim();
}
function detectArabicChars(s) {
  return /[يكىةأإؤئ]/.test(s || '');
}
function toPersianDigits(n) {
  return String(n).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}

/* ─────────────────────────────────────────────────────────────────────────
   DATA LAYER — fetch from data/ with in-memory cache
   ──────────────────────────────────────────────────────────────────────── */
const DATA = './data';
const cache = new Map();
async function fetchJson(path) {
  if (cache.has(path)) return cache.get(path);
  // Default browser cache mode; service worker handles persistence.
  // Earlier `force-cache` here pinned 404 responses across deploys.
  const p = fetch(path)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} for ${path}`); return r.json(); });
  cache.set(path, p);
  try { return await p; } catch (e) { cache.delete(path); throw e; }
}
const loadPoets   = () => fetchJson(`${DATA}/_poets.json`);
const loadPoet    = (slug) => fetchJson(`${DATA}/${slug}/_index.json`);
const loadPoem    = (slug, catPath, file) => {
  const path = catPath.length ? `${slug}/${catPath.join('/')}/${file}` : `${slug}/${file}`;
  return fetchJson(`${DATA}/${path}.json`);
};

/* Look up a category node inside a poet tree given a slug path. */
function getCatAt(tree, catPath) {
  let node = tree;
  for (const slug of catPath) {
    const next = (node.categories || []).find(c => c.slug === slug);
    if (!next) return null;
    node = next;
  }
  return node;
}
/* Breadcrumb from poet tree + cat slug path */
function breadcrumbFor(tree, catPath) {
  const out = [];
  let node = tree;
  for (const slug of catPath) {
    const next = (node.categories || []).find(c => c.slug === slug);
    if (!next) break;
    out.push({ slug, title_fa: next.title_fa });
    node = next;
  }
  return out;
}

/* ─────────────────────────────────────────────────────────────────────────
   HASH ROUTER
     #/                            → home
     #/poets                       → poet picker
     #/poet/hafez                  → poet view (top cats)
     #/poet/hafez/ghazal           → category view (poem list)
     #/poet/saadi/golestan/gbab4   → nested category view
     #/read/hafez/ghazal/108       → poem reader
     #/search                      → search
     #/settings                    → settings
   ──────────────────────────────────────────────────────────────────────── */
function parseHash() {
  const raw = (location.hash || '#/').slice(1);
  const parts = raw.split('/').filter(Boolean);
  if (parts.length === 0) return { view: 'home' };
  const head = parts[0];
  if (head === 'poets')    return { view: 'poets' };
  if (head === 'search')   return { view: 'search' };
  if (head === 'settings') return { view: 'settings' };
  if (head === 'poet' && parts.length >= 2)
    return { view: 'poet', poet: parts[1], catPath: parts.slice(2) };
  if (head === 'read' && parts.length >= 3) {
    const file = parts[parts.length - 1];
    return { view: 'read', poet: parts[1], catPath: parts.slice(2, -1), file };
  }
  return { view: 'home' };
}
function navigate(hash) {
  if (location.hash !== hash) location.hash = hash;
}

/* ─────────────────────────────────────────────────────────────────────────
   THEME / FONT / SETTINGS
   ──────────────────────────────────────────────────────────────────────── */
const THEMES = [
  { id: 'sepia', label: 'کاهی', emoji: '📜' },
  { id: 'light', label: 'روشن', emoji: '☀️' },
  { id: 'dark',  label: 'تاریک', emoji: '🌙' },
];
const FONTS = [
  { id: 'vazir',   label: 'وزیرمتن', stack: "'Vazirmatn', system-ui, sans-serif" },
  { id: 'estedad', label: 'استعداد', stack: "'Estedad', 'Vazirmatn', sans-serif" },
];
/* Font size sets the root font-size on <html>, which scales every rem-based
   length (Tailwind defaults). Set once globally; verses use text-2xl which
   becomes 1.5 * rootPx. */
const FONT_SIZES = [
  { id: 'xs', label: 'ریز',   rootPx: 13 },
  { id: 'sm', label: 'کوچک',  rootPx: 14 },
  { id: 'md', label: 'متوسط', rootPx: 16 },
  { id: 'lg', label: 'بزرگ',  rootPx: 18 },
  { id: 'xl', label: 'درشت',  rootPx: 22 },
];
function useLocalStorage(key, initial) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); return s !== null ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, setV];
}

/* ─────────────────────────────────────────────────────────────────────────
   APP
   ──────────────────────────────────────────────────────────────────────── */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [theme, setTheme] = useLocalStorage('theme', 'sepia');
  const [font, setFont] = useLocalStorage('font', 'vazir');
  const [fontSize, setFontSize] = useLocalStorage('fontSize', 'md');
  const [favorites, setFavorites] = useLocalStorage('favorites', []);
  const [recents, setRecents] = useLocalStorage('recents', []);

  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => {
    document.body.className = `theme-${theme}`;
    document.body.style.fontFamily = FONTS.find(f => f.id === font).stack;
  }, [theme, font]);
  useEffect(() => {
    const cfg = FONT_SIZES.find(s => s.id === fontSize);
    document.documentElement.style.fontSize = cfg ? `${cfg.rootPx}px` : '';
  }, [fontSize]);

  const toggleFav = useCallback((key) => {
    setFavorites(prev => prev.includes(key) ? prev.filter(x => x !== key) : [...prev, key]);
  }, []);
  const pushRecent = useCallback((key) => {
    setRecents(prev => {
      const next = [key, ...prev.filter(x => x !== key)];
      return next.slice(0, 20);
    });
  }, []);

  const titles = {
    home: 'گنجور', poets: 'فهرست شاعران', poet: '', search: 'جست‌وجو', settings: 'تنظیمات', read: '',
  };
  const showBack = route.view !== 'home';
  const headerTitle = titles[route.view] || '';

  return (
    <div className="min-h-full flex flex-col">
      <TopBar
        title={headerTitle}
        showBack={showBack}
        onBack={() => history.back()}
        onSearch={() => navigate('#/search')}
        onSettings={() => navigate('#/settings')}
      />
      <main className="flex-1 overflow-y-auto pb-24">
        {route.view === 'home' && <Home recents={recents} favorites={favorites} />}
        {route.view === 'poets' && <PoetPicker />}
        {route.view === 'poet' && <PoetView slug={route.poet} catPath={route.catPath || []} />}
        {route.view === 'read' && (
          <Reader
            slug={route.poet}
            catPath={route.catPath || []}
            file={route.file}
            favorites={favorites}
            onToggleFav={toggleFav}
            onView={pushRecent}
          />
        )}
        {route.view === 'search' && <SearchView />}
        {route.view === 'settings' && (
          <Settings
            theme={theme} setTheme={setTheme}
            font={font} setFont={setFont}
            fontSize={fontSize} setFontSize={setFontSize}
            favCount={favorites.length}
          />
        )}
      </main>
      {route.view !== 'read' && <BottomNav route={route} />}
    </div>
  );
}

function TopBar({ title, showBack, onBack, onSearch, onSettings }) {
  return (
    <header className="surface border-b border-soft pt-safe">
      <div className="flex items-center justify-between px-3 py-3 gap-2">
        {showBack
          ? <button onClick={onBack} className="text-2xl muted active:opacity-50 w-9 text-center">→</button>
          : <button onClick={onSettings} className="text-2xl muted active:opacity-50 w-9 text-center">⚙</button>}
        <h1 className="text-base font-semibold truncate flex-1 text-center">{title || 'گنجور'}</h1>
        <button onClick={onSearch} className="text-2xl muted active:opacity-50 w-9 text-center">🔍</button>
      </div>
    </header>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   HOME
   ──────────────────────────────────────────────────────────────────────── */
function Home({ recents, favorites }) {
  const [poets, setPoets] = useState(null);
  const [hafezIndex, setHafezIndex] = useState(null);
  const [faalLoading, setFaalLoading] = useState(false);

  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);
  useEffect(() => { loadPoet('hafez').then(setHafezIndex).catch(() => {}); }, []);

  // Quick poet-slug → nickname lookup for favorites/recents card labels
  const poetsBySlug = useMemo(() => {
    const m = new Map();
    (poets || []).forEach(p => m.set(p.slug, p));
    return m;
  }, [poets]);

  const featuredPoets = useMemo(() => {
    if (!poets) return [];
    const want = ['hafez', 'saadi', 'moulavi', 'khayyam', 'ferdousi', 'attar', 'nezami', 'sanaee'];
    return want.map(s => poets.find(p => p.slug === s)).filter(Boolean);
  }, [poets]);

  const doFaal = async () => {
    if (!hafezIndex || faalLoading) return;
    setFaalLoading(true);
    try {
      // Pick a random ghazal from hafez index
      const ghazalCat = (hafezIndex.tree.categories || []).find(c => c.slug === 'ghazal');
      if (!ghazalCat || !ghazalCat.poems || !ghazalCat.poems.length) return;
      const pick = ghazalCat.poems[Math.floor(Math.random() * ghazalCat.poems.length)];
      navigate(`#/read/hafez/ghazal/${pick.n}`);
    } finally { setFaalLoading(false); }
  };

  return (
    <div className="fade-in">
      <section className="px-5 pt-6 pb-2">
        <p className="muted text-sm">آرشیو متن‌باز شعر کلاسیک پارسی</p>
        <h2 className="text-3xl font-bold mt-1">گنجور</h2>
        <p className="muted text-sm mt-1">
          {poets ? toPersianDigits(poets.length) : '—'} شاعر،
          {' '}{poets ? toPersianDigits(poets.reduce((s, p) => s + (p.poems_count || 0), 0).toLocaleString('fa-IR')) : '—'} شعر
        </p>
      </section>

      <section className="px-4 mt-4">
        <button
          onClick={doFaal}
          disabled={!hafezIndex || faalLoading}
          className="w-full surface border border-soft rounded-2xl p-5 text-right active:opacity-80 transition disabled:opacity-60"
        >
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1">
              <p className="accent text-sm font-semibold mb-1">تفأل به دیوان حافظ</p>
              <p className="text-base leading-relaxed">
                {faalLoading ? 'در حال انتخاب…' : 'غزلی برای شما برگزیده می‌شود'}
              </p>
            </div>
            <span className="text-4xl">{faalLoading ? <span className="spinner" /> : '✦'}</span>
          </div>
        </button>
      </section>

      <section className="px-4 mt-5">
        <div className="flex items-center justify-between px-1 mb-2">
          <p className="muted text-xs">شاعران برجسته</p>
          <button onClick={() => navigate('#/poets')} className="accent text-xs">همه ←</button>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {featuredPoets.map(p => (
            <button
              key={p.slug}
              onClick={() => navigate(`#/poet/${p.slug}`)}
              className="surface border border-soft rounded-2xl p-4 text-right active:opacity-80"
            >
              <p className="font-bold text-lg">{toDisplay(p.nickname_fa)}</p>
              <p className="muted text-xs mt-0.5">{toDisplay(p.name_fa)}</p>
              <p className="muted text-xs mt-1">{toPersianDigits(p.poems_count.toLocaleString('fa-IR'))} شعر</p>
            </button>
          ))}
        </div>
      </section>

      {favorites.length > 0 && (
        <section className="mt-6">
          <p className="muted text-xs mb-2 px-5">نشان‌شده‌ها</p>
          <div className="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-1">
            {favorites.slice().reverse().map((key, i) => (
              <FavCard key={i} k={key} poetsBySlug={poetsBySlug} />
            ))}
          </div>
        </section>
      )}

      {recents.length > 0 && (
        <section className="px-4 mt-6">
          <p className="muted text-xs mb-2 px-1">اخیراً خوانده شده</p>
          <div className="space-y-2">
            {recents.slice(0, 5).map((key, i) => (
              <RecentRow key={i} k={key} poetsBySlug={poetsBySlug} />
            ))}
          </div>
        </section>
      )}

      <section className="px-5 mt-7">
        <h3 className="text-sm font-semibold mb-2">دربارهٔ این پروژه</h3>
        <p className="muted text-sm leading-7">
          گنجور-جیب آرشیوی متن‌باز و قابل ارجاع از شعر کلاسیک پارسی است،
          بر پایهٔ دادهٔ <span className="accent">ganjoor.net</span>.
          هدف: زیرساختی پایدار برای پروژه‌های آینده. کد تحت MIT، داده تحت CC-BY-4.0.
        </p>
      </section>

      <section className="px-5 mt-5 mb-8">
        <p className="muted text-xs">
          منبع داده: <a className="accent underline" href="https://ganjoor.net">گنجور</a> · حمیدرضا محمدی و همکاران
        </p>
      </section>
    </div>
  );
}
function parseKey(k) {
  const parts = (k || '').split('/').filter(Boolean);
  if (parts.length < 2) return null;
  return {
    slug: parts[0],
    cats: parts.slice(1, -1),
    file: parts[parts.length - 1],
  };
}
function labelFor(slug, poetsBySlug) {
  const p = poetsBySlug.get(slug);
  return toDisplay(p?.nickname_fa || p?.name_fa || slug);
}

function FavCard({ k, poetsBySlug }) {
  const parsed = parseKey(k);
  if (!parsed) return null;
  const catText = parsed.cats.join(' · ');
  return (
    <button
      onClick={() => navigate(`#/read/${k}`)}
      className="shrink-0 w-44 surface border border-soft rounded-xl px-3 py-2.5 text-start active:opacity-70"
    >
      <span className="accent text-[11px] block">★ {labelFor(parsed.slug, poetsBySlug)}</span>
      <span className="block text-sm font-semibold mt-1 truncate">
        {catText ? toDisplay(catText) + ' · ' : ''}{toPersianDigits(parsed.file)}
      </span>
    </button>
  );
}

function RecentRow({ k, poetsBySlug }) {
  const parsed = parseKey(k);
  if (!parsed) return null;
  const catText = parsed.cats.join(' · ');
  return (
    <button
      onClick={() => navigate(`#/read/${k}`)}
      className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"
    >
      <p className="text-sm">
        <span className="muted">{labelFor(parsed.slug, poetsBySlug)}</span>
        {catText && <span> · {toDisplay(catText)}</span>}
        {' · '}{toPersianDigits(parsed.file)}
      </p>
    </button>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   POET PICKER
   ──────────────────────────────────────────────────────────────────────── */
function PoetPicker() {
  const [poets, setPoets] = useState(null);
  const [q, setQ] = useState('');
  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);

  const filtered = useMemo(() => {
    if (!poets) return [];
    const needle = toSearch(q);
    if (!needle) return poets;
    return poets.filter(p =>
      toSearch(p.nickname_fa || '').includes(needle) ||
      toSearch(p.name_fa || '').includes(needle) ||
      (p.slug || '').toLowerCase().includes(needle)
    );
  }, [poets, q]);

  if (poets === null) return <Loading label="در حال بارگیری فهرست شاعران…" />;

  return (
    <div className="fade-in">
      <div className="px-4 pt-4 sticky top-0 z-10" style={{ backgroundColor: 'inherit' }}>
        <div className="surface-2 rounded-xl px-3 py-2 flex items-center gap-2">
          <span className="muted">🔎</span>
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="جست‌وجوی نام شاعر…"
            className="bg-transparent outline-none flex-1 text-base"
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
        </div>
        <p className="muted text-xs mt-2 px-1">
          {toPersianDigits(filtered.length)} از {toPersianDigits(poets.length)} شاعر
        </p>
      </div>

      <div className="px-3 py-2 grid grid-cols-1 gap-2">
        {filtered.map(p => (
          <button
            key={p.slug}
            onClick={() => navigate(`#/poet/${p.slug}`)}
            className="row surface border border-soft rounded-xl px-4 py-3 text-right"
          >
            <div className="flex items-baseline justify-between gap-3">
              <div className="flex-1 min-w-0">
                <p className="font-bold truncate">{toDisplay(p.nickname_fa || p.name_fa || p.slug)}</p>
                {p.name_fa && p.name_fa !== p.nickname_fa && (
                  <p className="muted text-xs truncate mt-0.5">{toDisplay(p.name_fa)}</p>
                )}
              </div>
              <p className="muted text-xs shrink-0">
                {toPersianDigits((p.poems_count || 0).toLocaleString('fa-IR'))} شعر
              </p>
            </div>
            {(p.birth_year || p.death_year) && (
              <p className="muted text-xs mt-1">
                {p.birth_year ? toPersianDigits(p.birth_year) : '؟'} – {p.death_year ? toPersianDigits(p.death_year) : '؟'} ه.ق
                {p.birth_place ? ` · ${toDisplay(p.birth_place)}` : ''}
              </p>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   POET VIEW — shows top-level cats AND, when navigated into, sub-cats/poems
   ──────────────────────────────────────────────────────────────────────── */
function PoetView({ slug, catPath }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    setData(null); setErr(null);
    loadPoet(slug).then(setData).catch(e => setErr(e.message));
  }, [slug]);

  if (err) return <ErrorBox msg={err} />;
  if (!data) return <Loading label="در حال بارگیری دیوان…" />;

  const node = getCatAt(data.tree, catPath);
  if (!node) return <ErrorBox msg="بخش مورد نظر یافت نشد." />;

  const crumbs = breadcrumbFor(data.tree, catPath);
  const subs = node.categories || [];
  const poems = node.poems || [];

  return (
    <div className="fade-in">
      <PoetHeader poet={data.poet} slug={slug} crumbs={crumbs} />
      <div className="px-4 mt-4 space-y-2 pb-8">
        {subs.length > 0 && subs.map(sub => (
          <button
            key={sub.slug}
            onClick={() => navigate(`#/poet/${slug}/${[...catPath, sub.slug].join('/')}`)}
            className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"
          >
            <div className="flex items-baseline justify-between gap-3">
              <p className="font-semibold flex-1 min-w-0 truncate">{toDisplay(sub.title_fa || sub.slug)}</p>
              <p className="muted text-xs shrink-0">
                {toPersianDigits((sub.poems_count || 0).toLocaleString('fa-IR'))} شعر
              </p>
            </div>
            {sub.book_name && (
              <p className="muted text-xs mt-0.5">{toDisplay(sub.book_name)}</p>
            )}
          </button>
        ))}
        {poems.length > 0 && (
          <PoemList slug={slug} catPath={catPath} poems={poems} />
        )}
        {subs.length === 0 && poems.length === 0 && (
          <p className="muted text-center mt-8">این بخش خالی است.</p>
        )}
      </div>
    </div>
  );
}

function PoetHeader({ poet, slug, crumbs }) {
  return (
    <section className="px-5 pt-5">
      <p className="muted text-xs">/{slug}{crumbs.map(c => `/${c.slug}`).join('')}</p>
      <h2 className="text-2xl font-bold mt-1">
        {toDisplay(poet.nickname_fa || poet.name_fa || slug)}
      </h2>
      {crumbs.length === 0 && poet.name_fa && (
        <p className="muted text-sm mt-1">{toDisplay(poet.name_fa)}</p>
      )}
      {crumbs.length > 0 && (
        <p className="text-sm mt-1">
          {crumbs.map((c, i) => (
            <span key={c.slug}>
              {i > 0 && <span className="muted"> · </span>}
              <span>{toDisplay(c.title_fa || c.slug)}</span>
            </span>
          ))}
        </p>
      )}
      {crumbs.length === 0 && (poet.birth_year || poet.birth_place) && (
        <p className="muted text-xs mt-2">
          {poet.birth_year ? `زادهٔ ${toPersianDigits(poet.birth_year)} ه.ق` : ''}
          {poet.birth_year && poet.birth_place ? ' · ' : ''}
          {poet.birth_place ? toDisplay(poet.birth_place) : ''}
        </p>
      )}
    </section>

}

function PoemList({ slug, catPath, poems }) {
  const [q, setQ] = useState('');
  const [page, setPage] = useState(0);
  const PAGE = 100;

  const filtered = useMemo(() => {
    const needle = toSearch(q);
    if (!needle) return poems;
    return poems.filter(p =>
      toSearch(p.title || '').includes(needle) ||
      toSearch(p.first || '').includes(needle)
    );
  }, [poems, q]);
  const shown = filtered.slice(0, (page + 1) * PAGE);
  const more = filtered.length > shown.length;

  return (
    <>
      {poems.length > 30 && (
        <div className="surface-2 rounded-xl px-3 py-2 flex items-center gap-2 mb-2">
          <span className="muted">🔎</span>
          <input
            value={q}
            onChange={(e) => { setQ(e.target.value); setPage(0); }}
            placeholder="جست‌وجو در این بخش…"
            className="bg-transparent outline-none flex-1 text-base"
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
        </div>
      )}
      {shown.map(p => (
        <button
          key={p.id}
          onClick={() => navigate(`#/read/${slug}/${[...catPath, p.n].join('/')}`)}
          className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"
        >
          <div className="flex items-baseline justify-between gap-2">
            <p className="muted text-xs shrink-0 w-12">{toPersianDigits(p.n)}</p>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium truncate">{toDisplay(p.title || '')}</p>
              {p.first && (
                <p className="muted text-xs mt-0.5 truncate">{toDisplay(p.first)}</p>
              )}
            </div>
          </div>
        </button>
      ))}
      {more && (
        <button
          onClick={() => setPage(p => p + 1)}
          className="w-full surface-2 border border-soft rounded-xl py-3 text-sm muted active:opacity-70 mt-2"
        >
          نمایش {toPersianDigits(Math.min(PAGE, filtered.length - shown.length))} مورد بیشتر
          ({toPersianDigits(shown.length)} از {toPersianDigits(filtered.length)})
        </button>
      )}
    </>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   READER
   ──────────────────────────────────────────────────────────────────────── */
function Reader({ slug, catPath, file, favorites, onToggleFav, onView }) {
  const [poem, setPoem] = useState(null);
  const [err, setErr] = useState(null);
  const [poetIndex, setPoetIndex] = useState(null);
  const favKey = `${slug}/${catPath.join('/')}${catPath.length ? '/' : ''}${file}`;
  const isFav = favorites.includes(favKey);

  useEffect(() => {
    setPoem(null); setErr(null);
    loadPoem(slug, catPath, file).then(env => {
      setPoem(env.poem || env);
      onView(favKey);
    }).catch(e => setErr(e.message));
    loadPoet(slug).then(setPoetIndex).catch(() => {});
  }, [slug, catPath.join('/'), file]);

  // All hooks MUST be called before any early return — React's rules of
  // hooks require a stable hook order across renders. Putting useMemo
  // after `if (!poem) return ...` causes "rendered more hooks than during
  // the previous render" and crashes the component to a blank screen.
  const flatPoems = useMemo(() => {
    const out = [];
    function walk(node, path) {
      for (const p of (node.poems || [])) out.push({ id: p.id, n: p.n, path });
      for (const sub of (node.categories || [])) walk(sub, [...path, sub.slug]);
    }
    if (poetIndex?.tree) walk(poetIndex.tree, []);
    return out;
  }, [poetIndex]);

  if (err) return <ErrorBox msg={err} />;
  if (!poem) return <Loading label="در حال بارگیری شعر…" />;

  // Group verses into beyts: pair pos=0 with pos=1; standalone otherwise.
  const verses = (poem.verses || []).slice().sort((a, b) => (a.vOrder || 0) - (b.vOrder || 0));
  const groups = [];
  let i = 0;
  while (i < verses.length) {
    const v = verses[i];
    const next = verses[i + 1];
    if (v.versePosition === 0 && next && next.versePosition === 1) {
      groups.push({ type: 'beyt', a: v, b: next });
      i += 2;
    } else if (v.versePosition === 2 || v.versePosition === 3) {
      groups.push({ type: 'centered', a: v });
      i += 1;
    } else {
      groups.push({ type: 'single', a: v });
      i += 1;
    }
  }

  const cat = poem.category?.cat?.title || '';
  const poet = poem.category?.poet?.nickname || '';
  const fullUrl = `https://ganjoor.net${poem.fullUrl || ''}`;
  const localUrl = `${location.origin}${location.pathname}#/read/${slug}/${[...catPath, file].join('/')}`;
  const urn = `urn:ganjoor:${slug}${catPath.length ? ':' + catPath.join(':') : ''}:${file}`;

  const prev = poem.previous;
  const next = poem.next;
  function goSibling(target) {
    if (!target || !target.id) return;
    const entry = flatPoems.find(x => x.id === target.id);
    if (!entry) return;
    navigate(`#/read/${[slug, ...entry.path, entry.n].join('/')}`);
  }
  const navReady = flatPoems.length > 0;

  const handleShare = async () => {
    const txt = `${poem.title} — ${poet}\n${(poem.plainText || '').split('\n').slice(0, 2).join('\n')}\n\n${localUrl}`;
    if (navigator.share) {
      try { await navigator.share({ title: poem.title, text: txt, url: localUrl }); }
      catch {}
    } else {
      try {
        await navigator.clipboard.writeText(txt);
        alert('متن و پیوند در کلیپ‌بورد کپی شد.');
      } catch {}
    }
  };
  const handleCopyLink = async () => {
    try { await navigator.clipboard.writeText(localUrl); alert('پیوند کپی شد.'); }
    catch {}
  };
  const handleCopyText = async () => {
    // Plain text only, normalized via toDisplay so Arabic ي/ك/ة become
    // Persian ی/ک/ه. No URLs, no markdown, no leading whitespace —
    // maximum compatibility with Telegram, email, plaintext editors.
    const title = toDisplay(poem.title || '').trim();
    const body  = toDisplay(poem.plainText || '').trim();
    const text  = title ? `${title}\n\n${body}` : body;
    try { await navigator.clipboard.writeText(text); alert('متن کپی شد.'); }
    catch {}
  };

  return (
    <div className="fade-in pb-12">
      <header className="px-3 py-3 flex items-center gap-2 border-b border-soft surface sticky top-0 z-10 pt-safe">
        <button onClick={() => history.back()} className="text-2xl active:opacity-50 w-9 text-center">→</button>
        <div className="flex-1 min-w-0 text-center">
          <p className="text-[11px] muted truncate">{toDisplay(poet)} · {toDisplay(cat)}</p>
          <p className="text-sm font-semibold truncate">{toDisplay(poem.title || '')}</p>
        </div>
        <button onClick={() => onToggleFav(favKey)} className="text-2xl active:opacity-50 w-9 text-center">
          {isFav ? '★' : '☆'}
        </button>
      </header>

      <article className="px-4 py-6">
        <div className="ornament my-4">۞</div>

        {groups.map((g, idx) => {
          if (g.type === 'beyt') {
            return (
              <div key={idx} className="my-4">
                <div className="beyt-grid beyt">
                  <p className="mesra-1 text-2xl">{toDisplay(g.a.text)}</p>
                  <span className="beyt-sep muted text-xs">۞</span>
                  <p className="mesra-2 text-2xl">{toDisplay(g.b.text)}</p>
                </div>
              </div>
            );
          }
          // centered or standalone single hemistich
          return (
            <div key={idx} className="my-3 verse-flow">
              <p className="single text-center text-2xl">{toDisplay(g.a.text)}</p>
            </div>
          );
        })}

        <div className="ornament mt-6 mb-4">۞</div>

        <div className="flex gap-2 mt-4">
          <button onClick={() => goSibling(prev)} disabled={!prev || !navReady}
            className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70 disabled:opacity-40">
            → پیشین
          </button>
          <button onClick={() => goSibling(next)} disabled={!next || !navReady}
            className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70 disabled:opacity-40">
            بعدی ←
          </button>
        </div>

        <div className="surface-2 rounded-xl p-4 mt-5 text-sm space-y-2">
          {poem.ganjoorMetre?.rhythm && <Row k="وزن" v={poem.ganjoorMetre.rhythm} />}
          {poem.rhyme && <Row k="قافیه" v={poem.rhyme} />}
          {cat && <Row k="بخش" v={cat} />}
          {typeof poem.coupletsCount === 'number' && (
            <Row k="تعداد ابیات" v={toPersianDigits(poem.coupletsCount)} />
          )}
          <Row k="نشانی پایدار" v={urn} mono />
          <Row k="در گنجور" v={<a href={fullUrl} target="_blank" rel="noopener" className="accent underline">{fullUrl.replace('https://','')}</a>} />
          <Row k="منبع" v="گنجور · ganjoor.net" />
        </div>

        <div className="flex gap-2 mt-4">
          <button onClick={handleShare} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            ↗ هم‌رسانی
          </button>
          <button onClick={handleCopyText} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            📝 کپی متن
          </button>
          <button onClick={handleCopyLink} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            🔗 کپی پیوند
          </button>
        </div>
      </article>
    </div>
  );
}
function Row({ k, v, mono }) {
  return (
    <div className="flex items-start justify-between gap-3">
      <span className="muted shrink-0">{k}</span>
      <span className={`text-end break-all ${mono ? 'font-mono text-xs' : ''}`}>{v}</span>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   SEARCH (poet picker + per-poet search prompt)
   ──────────────────────────────────────────────────────────────────────── */
function SearchView() {
  const [poets, setPoets] = useState(null);
  const [q, setQ] = useState('');
  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);

  const hasArabic = detectArabicChars(q);
  const filtered = useMemo(() => {
    if (!poets) return [];
    const needle = toSearch(q);
    if (!needle || needle.length < 1) return [];
    return poets.filter(p =>
      toSearch(p.nickname_fa || '').includes(needle) ||
      toSearch(p.name_fa || '').includes(needle) ||
      (p.slug || '').toLowerCase().includes(needle)
    ).slice(0, 30);
  }, [poets, q]);

  return (
    <div className="fade-in px-4 pt-4">
      <div className="surface-2 rounded-xl px-3 py-3 flex items-center gap-2">
        <span className="muted">🔎</span>
        <input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="نام شاعر…"
          className="bg-transparent outline-none flex-1 text-base"
          autoFocus
        />
        {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
      </div>

      {hasArabic && (
        <div className="mt-3 surface-2 border border-soft rounded-xl px-3 py-2 text-xs">
          <span className="muted">حروف عربی به فارسی نگاشته شد: </span>
          <span className="accent font-mono">{toDisplay(q)}</span>
        </div>
      )}

      {!q && poets && (
        <div className="mt-6 surface-2 border border-soft rounded-xl p-4 text-xs leading-7">
          <p className="font-semibold mb-1">یادداشت</p>
          <p className="muted">
            در حال حاضر، جست‌وجو در سطح شاعر کار می‌کند. ابتدا شاعر را انتخاب کنید،
            سپس در صفحهٔ هر بخش می‌توانید در عنوان و سطر آغازین شعرها جست‌وجو کنید.
            جست‌وجوی متن کامل در همهٔ ۱۲۰هزار شعر در نسخهٔ بعدی اضافه خواهد شد.
          </p>
        </div>
      )}

      <div className="mt-3 space-y-2 pb-6">
        {filtered.map(p => (
          <button
            key={p.slug}
            onClick={() => navigate(`#/poet/${p.slug}`)}
            className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"
          >
            <div className="flex items-baseline justify-between gap-3">
              <div className="flex-1 min-w-0">
                <p className="font-bold truncate">{toDisplay(p.nickname_fa || p.name_fa || p.slug)}</p>
                <p className="muted text-xs truncate mt-0.5">{toDisplay(p.name_fa || '')}</p>
              </div>
              <p className="muted text-xs shrink-0">{toPersianDigits((p.poems_count || 0).toLocaleString('fa-IR'))}</p>
            </div>
          </button>
        ))}
        {q && filtered.length === 0 && poets && (
          <p className="muted text-sm text-center mt-8">شاعری با این نام یافت نشد.</p>
        )}
      </div>
    </div>
  );
}

   SETTINGS
   ──────────────────────────────────────────────────────────────────────── */

          <p className="muted">با احترام و سپاس از حمیدرضا محمدی و همکاران گنجور.</p>
          <p className="muted text-xs mt-2">
            مخزن:{' '}
            <a href="https://github.com/sajad2025/ganjoor" target="_blank" rel="noopener" className="accent underline">

    <div className="flex gap-1.5 flex-wrap">
      {options.map(o => (
        <button
          key={o.id}
          onClick={() => onChange(o.id)}

/* ─────────────────────────────────────────────────────────────────────────
   COMMON BITS
   ──────────────────────────────────────────────────────────────────────── */

      <span className="spinner accent"></span>
      <p className="text-sm">{label || '…'}</p>

}

    <div className="fade-in px-6 pt-12 text-center">

      <button onClick={() => history.back()} className="mt-4 accent text-sm underline">بازگشت</button>
    </div>
  );
}
