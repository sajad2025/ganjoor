<body class="theme-sepia">

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ─────────────────────────────────────────────────────────────────────────
   PERSIAN TEXT NORMALIZATION (two-layer per the blueprint)
   ──────────────────────────────────────────────────────────────────────── */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const TO_FA = { 'ي': 'ی', 'ك': 'ک', 'ى': 'ی', 'ة': 'ه', 'ہ': 'ه' };
const DIAC = /[ً-ْٰـٕٔ]/g;
const BIDI = /[‎‏‪-‮⁦-⁩]/g;

function toDisplay(s) {
  return (s || '').normalize('NFC')
    .replace(/[يكىةہ]/g, c => TO_FA[c] || c)
    .replace(BIDI, '');
}
function toSearch(s) {
  let x = toDisplay(s).replace(DIAC, '')
    .replace(/[آأإ]/g, 'ا')
    .replace(/[ؤئء]/g, '')
    .replace(/[‌‍]/g, ' ');
  for (let i = 0; i < 10; i++) {
    x = x.replace(new RegExp(FA_DIGITS[i], 'g'), String(i));
    x = x.replace(new RegExp(AR_DIGITS[i], 'g'), String(i));
  }
  return x.toLowerCase().replace(/\s+/g, ' ').trim();
}
function detectArabicChars(s) {
  return /[يكىةأإؤئ]/.test(s || '');
}
function toPersianDigits(n) {
  return String(n).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}
function formatBytesFa(bytes) {
  if (bytes == null) return '';
  const KB = 1024, MB = KB * 1024, GB = MB * 1024;
  if (bytes < MB) {
    return `${Math.round(bytes / KB).toLocaleString('fa-IR')} کیلوبایت`;
  }
  if (bytes < GB) {
    return `${(bytes / MB).toLocaleString('fa-IR', { maximumFractionDigits: 1 })} مگابایت`;
  }
  return `${(bytes / GB).toLocaleString('fa-IR', { maximumFractionDigits: 2 })} گیگابایت`;
}

/* ─────────────────────────────────────────────────────────────────────────
   PERSISTENT STORE — IndexedDB-backed offline cache for data/*.json.

   The previous design routed every data fetch through the service worker
   and stored responses in Cache Storage. Worked correctly, but on iOS
   Safari cold-starting a PWA whose Cache Storage held ~17K entries took
   8+ seconds while the engine indexed the namespace. IndexedDB is built
   for thousands of small entries and pays no such tax; cold start now
   stays sub-100 ms regardless of how much the user has saved offline.

   Keys are the data/-relative path (e.g. "hafez/ghazal/1.json"). Values
   are raw JSON strings — parsing happens on read, which is cheaper than
   letting IDB structured-clone the parsed object on every write.
   ──────────────────────────────────────────────────────────────────── */
const IDB_NAME = 'ganjoor';
const IDB_VERSION = 1;
const IDB_STORE = 'data';

let _idbPromise = null;
function idb() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') { resolve(null); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => { _idbPromise = null; resolve(null); };
  });
  return _idbPromise;
}
async function idbGet(key) {
  const db = await idb();
  if (!db) return undefined;
  return new Promise((resolve) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => resolve(undefined);
  });
}
async function idbHas(key) {
  const db = await idb();
  if (!db) return false;
  return new Promise((resolve) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).getKey(key);
    req.onsuccess = () => resolve(req.result !== undefined);
    req.onerror   = () => resolve(false);
  });
}
async function idbPut(key, value) {
  const db = await idb();
  if (!db) return false;
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror    = () => resolve(false);
  });
}
function urlToIdbKey(path) {
  // ./data/hafez/_index.json → hafez/_index.json
  return path.replace(/^\.\/data\//, '').replace(/^\/+/, '');
}

/* ─────────────────────────────────────────────────────────────────────────
   DATA LAYER — IndexedDB hit (offline-saved) → in-memory cache → network
   ──────────────────────────────────────────────────────────────────────── */
const DATA = './data';
const cache = new Map();
async function fetchJson(path) {
  if (cache.has(path)) return cache.get(path);
  const p = (async () => {
    const key = urlToIdbKey(path);
    // IDB lookup is essentially free when the key is absent (a single
    // getKey roundtrip), so it's safe to do unconditionally — saves a
    // network round-trip on every call when the user is offline-saved.
    try {
      const stored = await idbGet(key);
      if (stored !== undefined) {
        return typeof stored === 'string' ? JSON.parse(stored) : stored;
      }
    } catch { /* IDB failures fall through to network */ }
    const r = await fetch(path);
    if (!r.ok) throw new Error(`HTTP ${r.status} for ${path}`);
    const text = await r.text();
    // Opportunistic write-through: anything the user views online silently
    // becomes available offline next time. Fire-and-forget so a slow IDB
    // write never blocks the render path; failures are swallowed because
    // the response is already in hand.
    idbPut(key, text).catch(() => {});
    return JSON.parse(text);
  })();
  cache.set(path, p);
  try { return await p; } catch (e) { cache.delete(path); throw e; }
}
const loadPoets   = () => fetchJson(`${DATA}/_poets.json`);
const loadPoet    = (slug) => fetchJson(`${DATA}/${slug}/_index.json`);
const loadPoem    = (slug, catPath, file) => {
  const path = catPath.length ? `${slug}/${catPath.join('/')}/${file}` : `${slug}/${file}`;
  return fetchJson(`${DATA}/${path}.json`);
};

/* Offline cache — the 8 شاعران برجسته (canonical featured poets).
   Hand-curated; matches the home-page "featured" list. Keep aligned. */
const FAMOUS_POETS = ['hafez', 'saadi', 'moulavi', 'khayyam', 'ferdousi', 'attar', 'sanaee', 'nezami'];

/* Walk a poet's _index.json tree and emit every poem's data/<...>.json URL,
   mirroring the path math in loadPoem() so the cached responses populate the
   exact URLs the Reader will request later. */
function enumeratePoemUrls(slug, tree) {
  const urls = [];
  (function walk(node, catPath) {
    for (const p of node.poems || []) {
      const tail = catPath.length ? `${catPath.join('/')}/${p.n}` : `${p.n}`;
      urls.push(`${DATA}/${slug}/${tail}.json`);
    }
    for (const c of node.categories || []) walk(c, [...catPath, c.slug]);
  })(tree, []);
  return urls;
}

/* Full-text search corpus — loaded lazily on first search.
   Each poet has a _search.json built by scripts/build_search_index.py:
     [[urlTail, displayTitle, normalizedPlainText], ...]
   We merge into a flat array of [poetSlug, urlTail, displayTitle, normalizedText].
   Held at module scope so the cost is paid once per session; SW caches the
   underlying HTTP responses for offline use after the first load.        */
let _searchCorpus = null;
let _searchCorpusPromise = null;
async function loadSearchCorpus(poetSlugs, onProgress) {
  if (_searchCorpus) return _searchCorpus;
  if (_searchCorpusPromise) return _searchCorpusPromise;
  _searchCorpusPromise = (async () => {
    const merged = [];
    let done = 0;
    const total = poetSlugs.length;
    await Promise.all(poetSlugs.map(async (slug) => {
      try {
        // fetchJson hits IDB first (offline-saved) and falls back to
        // network, so search works fully offline once the user has saved.
        const arr = await fetchJson(`${DATA}/${slug}/_search.json`);
        for (const e of arr) merged.push([slug, e[0], e[1], e[2]]);
      } catch (_) { /* skip poets without a shard */ }
      finally {
        done++;
        if (onProgress) onProgress(done, total);
      }
    }));
    _searchCorpus = merged;
    return merged;
  })();
  return _searchCorpusPromise;
}

/* Look up a category node inside a poet tree given a slug path. */
function getCatAt(tree, catPath) {
  let node = tree;
  for (const slug of catPath) {
    const next = (node.categories || []).find(c => c.slug === slug);
    if (!next) return null;
    node = next;
  }
  return node;
}
/* Breadcrumb from poet tree + cat slug path */
function breadcrumbFor(tree, catPath) {
  const out = [];
  let node = tree;
  for (const slug of catPath) {
    const next = (node.categories || []).find(c => c.slug === slug);
    if (!next) break;
    out.push({ slug, title_fa: next.title_fa });
    node = next;
  }
  return out;
}

/* ─────────────────────────────────────────────────────────────────────────
   HASH ROUTER
     #/                            → home
     #/poets                       → poet picker
     #/poet/hafez                  → poet view (top cats)
     #/poet/hafez/ghazal           → category view (poem list)
     #/poet/saadi/golestan/gbab4   → nested category view
     #/read/hafez/ghazal/108       → poem reader
     #/search                      → search
     #/settings                    → settings
   ──────────────────────────────────────────────────────────────────────── */
function parseHash() {
  const raw = (location.hash || '#/').slice(1);
  const parts = raw.split('/').filter(Boolean);
  if (parts.length === 0) return { view: 'home' };
  const head = parts[0];
  if (head === 'poets')    return { view: 'poets' };
  if (head === 'search')   return { view: 'search' };
  if (head === 'settings') return { view: 'settings' };
  if (head === 'poet' && parts.length >= 2)
    return { view: 'poet', poet: parts[1], catPath: parts.slice(2) };
  if (head === 'read' && parts.length >= 3) {
    const file = parts[parts.length - 1];
    return { view: 'read', poet: parts[1], catPath: parts.slice(2, -1), file };
  }
  return { view: 'home' };
}
function navigate(hash) {
  if (location.hash !== hash) location.hash = hash;
}

/* ─────────────────────────────────────────────────────────────────────────
   THEME / FONT / SETTINGS
   ──────────────────────────────────────────────────────────────────────── */
const THEMES = [
  { id: 'sepia', label: 'کاهی', emoji: '📜' },
  { id: 'light', label: 'روشن', emoji: '☀️' },
  { id: 'dark',  label: 'تاریک', emoji: '🌙' },
];
const FONTS = [
  { id: 'vazir',   label: 'وزیرمتن', stack: "'Vazirmatn', system-ui, sans-serif" },
  { id: 'estedad', label: 'استعداد', stack: "'Estedad', 'Vazirmatn', sans-serif" },
];
/* Font size sets the root font-size on <html>, which scales every rem-based
   length (Tailwind defaults). Set once globally; verses use text-2xl which
   becomes 1.5 * rootPx. */
const FONT_SIZES = [
  { id: 'xs', label: 'ریز',   rootPx: 13 },
  { id: 'sm', label: 'کوچک',  rootPx: 14 },
  { id: 'md', label: 'متوسط', rootPx: 16 },
  { id: 'lg', label: 'بزرگ',  rootPx: 18 },
  { id: 'xl', label: 'درشت',  rootPx: 22 },
];
function useLocalStorage(key, initial) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); return s !== null ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, setV];
}

/* ─────────────────────────────────────────────────────────────────────────
   APP
   ──────────────────────────────────────────────────────────────────────── */
function App() {
  const [route, setRoute] = useState(parseHash());
  const [theme, setTheme] = useLocalStorage('theme', 'sepia');
  const [font, setFont] = useLocalStorage('font', 'vazir');
  const [fontSize, setFontSize] = useLocalStorage('fontSize', 'md');
  const [favorites, setFavorites] = useLocalStorage('favorites', []);
  const [recents, setRecents] = useLocalStorage('recents', []);

  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => {
    document.body.className = `theme-${theme}`;
    document.body.style.fontFamily = FONTS.find(f => f.id === font).stack;
  }, [theme, font]);
  useEffect(() => {
    const cfg = FONT_SIZES.find(s => s.id === fontSize);
    document.documentElement.style.fontSize = cfg ? `${cfg.rootPx}px` : '';
  }, [fontSize]);

  const toggleFav = useCallback((key) => {
    setFavorites(prev => prev.includes(key) ? prev.filter(x => x !== key) : [...prev, key]);
  }, []);
  const pushRecent = useCallback((key) => {
    setRecents(prev => {
      const next = [key, ...prev.filter(x => x !== key)];
      return next.slice(0, 20);
    });
  }, []);

  const titles = {
    home: 'گنجور', poets: 'فهرست شاعران', poet: '', search: 'جست‌وجو', settings: 'تنظیمات', read: '',
  };
  const showBack = route.view !== 'home';
  const headerTitle = titles[route.view] || '';

  return (
    <div className="min-h-full flex flex-col">
      <TopBar
        title={headerTitle}
        showBack={showBack}
        onBack={() => history.back()}
        onHome={() => navigate('#/')}
        onSearch={() => navigate('#/search')}
        onSettings={() => navigate('#/settings')}
      />
      <main className="flex-1 overflow-y-auto pb-24">
        {route.view === 'home' && <Home recents={recents} favorites={favorites} />}
        {route.view === 'poets' && <PoetPicker />}
        {route.view === 'poet' && <PoetView slug={route.poet} catPath={route.catPath || []} />}
        {route.view === 'read' && (
          <Reader
            slug={route.poet}
            catPath={route.catPath || []}
            file={route.file}
            favorites={favorites}
            onToggleFav={toggleFav}
            onView={pushRecent}
          />
        )}
        {route.view === 'search' && <SearchView />}
        {route.view === 'settings' && (
          <Settings
            theme={theme} setTheme={setTheme}
            font={font} setFont={setFont}
            fontSize={fontSize} setFontSize={setFontSize}
            favCount={favorites.length}
          />
        )}
      </main>
      {route.view !== 'read' && <BottomNav route={route} />}
    </div>
  );
}

function TopBar({ title, showBack, onBack, onHome, onSearch, onSettings }) {
  return (
    <header className="surface border-b border-soft pt-safe">
      <div className="flex items-center justify-between px-3 py-3 gap-2">
        {showBack
          ? <button onClick={onBack} className="text-2xl muted active:opacity-50 w-9 text-center">→</button>
          : <button onClick={onSettings} className="text-2xl muted active:opacity-50 w-9 text-center">⚙</button>}
        {showBack && !title
          ? <button
              onClick={onHome}
              aria-label="خانه"
              className="flex-1 flex items-center justify-center gap-1.5 active:opacity-50"
            >
              <span className="text-xl">🏠</span>
              <span className="text-base font-semibold">خانه</span>
            </button>
          : <h1 className="text-base font-semibold truncate flex-1 text-center">{title || 'گنجور'}</h1>}
        <button onClick={onSearch} className="text-2xl muted active:opacity-50 w-9 text-center">🔍</button>
      </div>
    </header>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   HOME
   ──────────────────────────────────────────────────────────────────────── */
function Home({ recents, favorites }) {
  const [poets, setPoets] = useState(null);
  const [hafezIndex, setHafezIndex] = useState(null);
  const [faalLoading, setFaalLoading] = useState(false);

  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);
  useEffect(() => { loadPoet('hafez').then(setHafezIndex).catch(() => {}); }, []);

  // Quick poet-slug → nickname lookup for favorites/recents card labels
  const poetsBySlug = useMemo(() => {
    const m = new Map();
    (poets || []).forEach(p => m.set(p.slug, p));
    return m;
  }, [poets]);

  const featuredPoets = useMemo(() => {
    if (!poets) return [];
    const want = ['hafez', 'saadi', 'moulavi', 'khayyam', 'ferdousi', 'attar', 'nezami', 'sanaee'];
    return want.map(s => poets.find(p => p.slug === s)).filter(Boolean);
  }, [poets]);

  const doFaal = async () => {
    if (!hafezIndex || faalLoading) return;
    setFaalLoading(true);
    try {
      // Pick a random ghazal from hafez index
      const ghazalCat = (hafezIndex.tree.categories || []).find(c => c.slug === 'ghazal');
      if (!ghazalCat || !ghazalCat.poems || !ghazalCat.poems.length) return;
      const pick = ghazalCat.poems[Math.floor(Math.random() * ghazalCat.poems.length)];
      navigate(`#/read/hafez/ghazal/${pick.n}`);
    } finally { setFaalLoading(false); }
  };

  return (
    <div className="fade-in">
      <section className="px-5 pt-6 pb-2">
        <p className="muted text-sm">آرشیو متن‌باز شعر کلاسیک پارسی</p>
        <h2 className="text-3xl font-bold mt-1">گنجور</h2>
        <p className="muted text-sm mt-1">
          {poets ? toPersianDigits(poets.length) : '—'} شاعر،
          {' '}{poets ? toPersianDigits(poets.reduce((s, p) => s + (p.poems_count || 0), 0).toLocaleString('fa-IR')) : '—'} شعر
        </p>
      </section>

      <section className="px-4 mt-4">
        <button
          onClick={doFaal}

function parseKey(k) {
  const parts = (k || '').split('/').filter(Boolean);
  if (parts.length < 2) return null;
  return {
    slug: parts[0],
    cats: parts.slice(1, -1),
    file: parts[parts.length - 1],
  };
}
function labelFor(slug, poetsBySlug) {
  const p = poetsBySlug.get(slug);
  return toDisplay(p?.nickname_fa || p?.name_fa || slug);
}

function FavCard({ k, poetsBySlug }) {
  const parsed = parseKey(k);
  if (!parsed) return null;
  const catText = parsed.cats.join(' · ');
  return (
    <button
      onClick={() => navigate(`#/read/${k}`)}
      className="shrink-0 w-44 surface border border-soft rounded-xl px-3 py-2.5 text-start active:opacity-70"
    >
      <span className="accent text-[11px] block">★ {labelFor(parsed.slug, poetsBySlug)}</span>
      <span className="block text-sm font-semibold mt-1 truncate">
        {catText ? toDisplay(catText) + ' · ' : ''}{toPersianDigits(parsed.file)}
      </span>
    </button>
  );
}

function RecentRow({ k, poetsBySlug }) {
  const parsed = parseKey(k);
  if (!parsed) return null;
  const catText = parsed.cats.join(' · ');
  return (
    <button
      onClick={() => navigate(`#/read/${k}`)}
      className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"

        {catText && <span> · {toDisplay(catText)}</span>}

}

function PoetPicker() {
  const [poets, setPoets] = useState(null);

  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);

  const filtered = useMemo(() => {
    if (!poets) return [];
    const needle = toSearch(q);

      toSearch(p.nickname_fa || '').includes(needle) ||
      toSearch(p.name_fa || '').includes(needle) ||
      (p.slug || '').toLowerCase().includes(needle)
    );
    // Oldest poets first — sort ascending by birth year (Hijri); any
    // poet missing a birth year sinks to the bottom.
    return list.slice().sort((a, b) =>

            className="bg-transparent outline-none flex-1 text-base"

          {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
        </div>
        <p className="muted text-xs mt-2 px-1">
          {toPersianDigits(filtered.length)} از {toPersianDigits(poets.length)} شاعر
        </p>

          <button
            key={p.slug}

function PoemList({ slug, catPath, poems }) {
  const [q, setQ] = useState('');
  const [page, setPage] = useState(0);
  const PAGE = 100;
  const sentinelRef = useRef(null);

  const filtered = useMemo(() => {
    const needle = toSearch(q);
    if (!needle) return poems;
    return poems.filter(p =>
      toSearch(p.title || '').includes(needle) ||
      toSearch(p.first || '').includes(needle)
    );
  }, [poems, q]);
  const shown = filtered.slice(0, (page + 1) * PAGE);
  const more = filtered.length > shown.length;

  // Infinite scroll: load the next page automatically when the sentinel
  // near the bottom scrolls into view, so the user just keeps scrolling
  // (no "load more" click). rootMargin pre-loads before it's on screen.
  useEffect(() => {
    if (!more) return;
    const el = sentinelRef.current;
    if (!el || typeof IntersectionObserver === 'undefined') {
      if (more) setPage(p => p + 1); // fallback: render everything
      return;
    }
    const io = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) setPage(p => p + 1);
    }, { rootMargin: '800px' });
    io.observe(el);
    return () => io.disconnect();
  }, [more, page]);

  return (
    <>
      {poems.length > 30 && (
        <div className="surface-2 rounded-xl px-3 py-2 flex items-center gap-2 mb-2">
          <span className="muted">🔎</span>
          <input
            value={q}
            onChange={(e) => { setQ(e.target.value); setPage(0); }}
            placeholder="جست‌وجو در این بخش…"
            className="bg-transparent outline-none flex-1 text-base"
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
        </div>
      )}
      {shown.map(p => (
        <button
          key={p.id}
          onClick={() => navigate(`#/read/${slug}/${[...catPath, p.n].join('/')}`)}
          className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"

            <p className="muted text-xs shrink-0 w-12">{toPersianDigits(p.n)}</p>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium truncate">{toDisplay(p.title || '')}</p>
              {p.first && (
                <p className="muted text-xs mt-0.5 truncate">{toDisplay(p.first)}</p>
              )}
            </div>
          </div>
        </button>
      ))}
      {more && (
        <div ref={sentinelRef} className="w-full py-4 text-center text-sm muted">
          … {toPersianDigits(shown.length)} از {toPersianDigits(filtered.length)}
        </div>
      )}
    </>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   READER
   ──────────────────────────────────────────────────────────────────────── */
function Reader({ slug, catPath, file, favorites, onToggleFav, onView }) {
  const [poem, setPoem] = useState(null);
  const [err, setErr] = useState(null);
  const [poetIndex, setPoetIndex] = useState(null);
  const favKey = `${slug}/${catPath.join('/')}${catPath.length ? '/' : ''}${file}`;
  const isFav = favorites.includes(favKey);

  useEffect(() => {
    setPoem(null); setErr(null);
    loadPoem(slug, catPath, file).then(env => {
      setPoem(env.poem || env);
      onView(favKey);
    }).catch(e => setErr(e.message));
    loadPoet(slug).then(setPoetIndex).catch(() => {});
  }, [slug, catPath.join('/'), file]);

  // All hooks MUST be called before any early return — React's rules of
  // hooks require a stable hook order across renders. Putting useMemo
  // after `if (!poem) return ...` causes "rendered more hooks than during
  // the previous render" and crashes the component to a blank screen.
  const flatPoems = useMemo(() => {
    const out = [];
    function walk(node, path) {
      for (const p of (node.poems || [])) out.push({ id: p.id, n: p.n, path });
      for (const sub of (node.categories || [])) walk(sub, [...path, sub.slug]);
    }
    if (poetIndex?.tree) walk(poetIndex.tree, []);
    return out;
  }, [poetIndex]);

  if (err) return <ErrorBox msg={err} />;
  if (!poem) return <Loading label="در حال بارگیری شعر…" />;

  // Group verses into beyts: pair pos=0 with pos=1; standalone otherwise.
  const verses = (poem.verses || []).slice().sort((a, b) => (a.vOrder || 0) - (b.vOrder || 0));
  const groups = [];
  let i = 0;
  while (i < verses.length) {
    const v = verses[i];
    const next = verses[i + 1];
    if (v.versePosition === 0 && next && next.versePosition === 1) {
      groups.push({ type: 'beyt', a: v, b: next });
      i += 2;
    } else if (v.versePosition === 2 || v.versePosition === 3) {
      groups.push({ type: 'centered', a: v });
      i += 1;
    } else {
      groups.push({ type: 'single', a: v });
      i += 1;
    }
  }

  const cat = poem.category?.cat?.title || '';
  const poet = poem.category?.poet?.nickname || '';
  const fullUrl = `https://ganjoor.net${poem.fullUrl || ''}`;
  const localUrl = `${location.origin}${location.pathname}#/read/${slug}/${[...catPath, file].join('/')}`;
  const urn = `urn:ganjoor:${slug}${catPath.length ? ':' + catPath.join(':') : ''}:${file}`;

  const prev = poem.previous;
  const next = poem.next;
  function goSibling(target) {
    if (!target || !target.id) return;
    const entry = flatPoems.find(x => x.id === target.id);
    if (!entry) return;
    navigate(`#/read/${[slug, ...entry.path, entry.n].join('/')}`);
  }
  const navReady = flatPoems.length > 0;

  const handleShare = async () => {
    const txt = `${poem.title} — ${poet}\n${(poem.plainText || '').split('\n').slice(0, 2).join('\n')}\n\n${localUrl}`;
    if (navigator.share) {
      try { await navigator.share({ title: poem.title, text: txt, url: localUrl }); }
      catch {}
    } else {
      try {
        await navigator.clipboard.writeText(txt);
        alert('متن و پیوند در کلیپ‌بورد کپی شد.');
      } catch {}
    }
  };
  const handleCopyLink = async () => {
    try { await navigator.clipboard.writeText(localUrl); alert('پیوند کپی شد.'); }
    catch {}
  };
  const handleCopyText = async () => {
    // Plain text only, normalized via toDisplay so Arabic ي/ك/ة become
    // Persian ی/ک/ه. No URLs, no markdown, no leading whitespace —
    // maximum compatibility with Telegram, email, plaintext editors.
    const title = toDisplay(poem.title || '').trim();
    const body  = toDisplay(poem.plainText || '').trim();
    const text  = title ? `${title}\n\n${body}` : body;
    try { await navigator.clipboard.writeText(text); alert('متن کپی شد.'); }
    catch {}
  };

  return (
    <div className="fade-in pb-12">
      <header className="px-3 py-3 flex items-center gap-2 border-b border-soft surface sticky top-0 z-10 pt-safe">
        <button onClick={() => history.back()} className="text-2xl active:opacity-50 w-9 text-center">→</button>
        <div className="flex-1 min-w-0 text-center">
          <p className="text-[11px] muted truncate">{toDisplay(poet)} · {toDisplay(cat)}</p>
          <p className="text-sm font-semibold truncate">{toDisplay(poem.title || '')}</p>
        </div>
        <button onClick={() => onToggleFav(favKey)} className="text-2xl active:opacity-50 w-9 text-center">
          {isFav ? '★' : '☆'}
        </button>
      </header>

      <article className="px-4 py-6">
        <div className="ornament my-4">۞</div>

        {groups.map((g, idx) => {
          if (g.type === 'beyt') {
            return (
              <div key={idx} className="my-4">
                <div className="beyt-grid beyt">
                  <p className="mesra-1 text-2xl">{toDisplay(g.a.text)}</p>
                  <span className="beyt-sep muted text-xs">۞</span>
                  <p className="mesra-2 text-2xl">{toDisplay(g.b.text)}</p>
                </div>
              </div>
            );
          }
          // centered or standalone single hemistich
          return (
            <div key={idx} className="my-3 verse-flow">
              <p className="single text-center text-2xl">{toDisplay(g.a.text)}</p>
            </div>
          );
        })}

        <div className="ornament mt-6 mb-4">۞</div>

        <div className="flex gap-2 mt-4">
          <button onClick={() => goSibling(prev)} disabled={!prev || !navReady}
            className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70 disabled:opacity-40">
            → پیشین
          </button>
          <button onClick={() => goSibling(next)} disabled={!next || !navReady}
            className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70 disabled:opacity-40">
            بعدی ←
          </button>
        </div>

        <div className="surface-2 rounded-xl p-4 mt-5 text-sm space-y-2">
          {poem.ganjoorMetre?.rhythm && <Row k="وزن" v={poem.ganjoorMetre.rhythm} />}
          {poem.rhyme && <Row k="قافیه" v={poem.rhyme} />}
          {cat && <Row k="بخش" v={cat} />}
          {typeof poem.coupletsCount === 'number' && (
            <Row k="تعداد ابیات" v={toPersianDigits(poem.coupletsCount)} />
          )}
          <Row k="نشانی پایدار" v={urn} mono />
          <Row k="در گنجور" v={<a href={fullUrl} target="_blank" rel="noopener" className="accent underline">{fullUrl.replace('https://','')}</a>} />
          <Row k="منبع" v="گنجور · ganjoor.net" />
        </div>

        <div className="flex gap-2 mt-4">
          <button onClick={handleShare} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            ↗ هم‌رسانی
          </button>
          <button onClick={handleCopyText} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            📝 کپی متن
          </button>
          <button onClick={handleCopyLink} className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
            🔗 کپی پیوند
          </button>
        </div>
      </article>
    </div>
  );
}
function Row({ k, v, mono }) {
  return (
    <div className="flex items-start justify-between gap-3">
      <span className="muted shrink-0">{k}</span>
      <span className={`text-end break-all ${mono ? 'font-mono text-xs' : ''}`}>{v}</span>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────

   ──────────────────────────────────────────────────────────────────────── */
const MAX_TEXT_RESULTS = 200;

function snippetAround(text, idx, len) {
  const W = 50;
  const start = Math.max(0, idx - W);
  const end = Math.min(text.length, idx + len + W);
  return {
    pre: (start > 0 ? '…' : '') + text.slice(start, idx),
    hit: text.slice(idx, idx + len),
    post: text.slice(idx + len, end) + (end < text.length ? '…' : ''),
  };
}

function SearchView() {
  const [poets, setPoets] = useState(null);
  const [q, setQ] = useState('');
  const [debouncedQ, setDebouncedQ] = useState('');
  const [corpus, setCorpus] = useState(_searchCorpus);
  const [progress, setProgress] = useState(_searchCorpus ? null : null);
  const [loadError, setLoadError] = useState(null);

  // Load poet metadata
  useEffect(() => { loadPoets().then(d => setPoets(d.poets || [])).catch(() => setPoets([])); }, []);

  // Debounce typing (substring scan of 129K entries is fast but no need to thrash)
  useEffect(() => {
    const t = setTimeout(() => setDebouncedQ(q), 150);
    return () => clearTimeout(t);
  }, [q]);

  // Lazily load the full-text corpus the first time a real query is entered
  useEffect(() => {
    if (corpus || !poets || poets.length === 0) return;
    if (toSearch(debouncedQ).length < 2) return;
    const slugs = poets.map(p => p.slug);
    setProgress({ loaded: 0, total: slugs.length });
    loadSearchCorpus(slugs, (loaded, total) => setProgress({ loaded, total }))
      .then(c => { setCorpus(c); setProgress(null); })
      .catch(err => { setLoadError(String(err)); setProgress(null); });
  }, [poets, debouncedQ, corpus]);

  const poetBySlug = useMemo(() => {
    const m = new Map();
    (poets || []).forEach(p => m.set(p.slug, p));
    return m;
  }, [poets]);

  const needle = toSearch(debouncedQ);
  const hasArabic = detectArabicChars(q);

  const poetMatches = useMemo(() => {
    if (!poets || needle.length < 1) return [];
    return poets.filter(p =>
      toSearch(p.nickname_fa || '').includes(needle) ||
      toSearch(p.name_fa || '').includes(needle) ||
      (p.slug || '').toLowerCase().includes(needle)
    ).slice(0, 5);
  }, [poets, needle]);

  const textMatches = useMemo(() => {
    if (!corpus || needle.length < 2) return [];
    const out = [];
    for (let i = 0; i < corpus.length; i++) {
      const e = corpus[i];
      const idx = e[3].indexOf(needle);
      if (idx >= 0) {
        out.push({ slug: e[0], tail: e[1], title: e[2], text: e[3], idx });
        if (out.length >= MAX_TEXT_RESULTS) break;
      }
    }
    return out;
  }, [corpus, needle]);

  return (
    <div className="fade-in px-4 pt-4">
      <div className="surface-2 rounded-xl px-3 py-3 flex items-center gap-2">
        <span className="muted">🔎</span>
        <input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="جست‌وجوی هر کلمه در ۱۲۹هزار شعر…"
          className="bg-transparent outline-none flex-1 text-base"
          autoFocus
        />
        {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
      </div>

      {hasArabic && (
        <div className="mt-3 surface-2 border border-soft rounded-xl px-3 py-2 text-xs">
          <span className="muted">حروف عربی به فارسی نگاشته شد: </span>
          <span className="accent font-mono">{toDisplay(q)}</span>
        </div>
      )}

      {!q && (
        <div className="mt-6 surface-2 border border-soft rounded-xl p-4 text-xs leading-7">
          <p className="muted">
            هر کلمه یا عبارت را در متن شعرها جست‌وجو می‌کند. نخستین جست‌وجو ممکن است
            چند ثانیه طول بکشد تا نمایه بارگیری شود؛ پس از آن همه چیز برون‌خط کار می‌کند.
          </p>
        </div>
      )}

      {q && needle.length < 2 && (
        <p className="muted text-sm text-center mt-8">حداقل ۲ نویسه وارد کنید.</p>
      )}

      {q && progress && (
        <p className="muted text-xs text-center mt-6">
          بارگذاری نمایهٔ جست‌وجو: {toPersianDigits(progress.loaded)} / {toPersianDigits(progress.total)} شاعر
        </p>
      )}

      {q && loadError && (
        <p className="muted text-sm text-center mt-8">خطا در بارگذاری نمایه: {loadError}</p>
      )}

      {q && poetMatches.length > 0 && (
        <div className="mt-4">
          <p className="text-xs muted mb-2">شاعران</p>
          <div className="space-y-2">
            {poetMatches.map(p => (
              <button
                key={p.slug}
                onClick={() => navigate(`#/poet/${p.slug}`)}
                className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right"
              >
                <div className="flex items-baseline justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <p className="font-bold truncate">{toDisplay(p.nickname_fa || p.name_fa || p.slug)}</p>
                    <p className="muted text-xs truncate mt-0.5">{toDisplay(p.name_fa || '')}</p>
                  </div>
                  <p className="muted text-xs shrink-0">{toPersianDigits((p.poems_count || 0).toLocaleString('fa-IR'))}</p>
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {q && needle.length >= 2 && corpus && (
        <div className="mt-4 pb-6">
          <p className="text-xs muted mb-2">
            در متن شعرها: {textMatches.length >= MAX_TEXT_RESULTS ? `+${toPersianDigits(MAX_TEXT_RESULTS)}` : toPersianDigits(textMatches.length)} نتیجه
          </p>
          <div className="space-y-2">
            {textMatches.map((r, i) => {
              const p = poetBySlug.get(r.slug);
              const snip = snippetAround(r.text, r.idx, needle.length);
              return (
                <button
                  key={`${r.slug}/${r.tail}/${i}`}
                  onClick={() => navigate(`#/read/${r.slug}/${r.tail}`)}
                  className="row w-full surface border border-soft rounded-xl px-4 py-3 text-right block"
                >
                  <p className="text-xs muted truncate">{toDisplay(p?.nickname_fa || p?.name_fa || r.slug)}</p>
                  <p className="font-semibold truncate mt-0.5">{r.title || toDisplay(r.tail)}</p>
                  <p className="muted text-xs mt-1 leading-6 break-words">
                    {snip.pre}<span className="accent font-bold">{snip.hit}</span>{snip.post}
                  </p>
                </button>
              );
            })}
            {textMatches.length === 0 && poetMatches.length === 0 && (
              <p className="muted text-sm text-center mt-8">نتیجه‌ای یافت نشد.</p>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   OFFLINE CACHE — one tap pulls every poem from the 8 featured poets
   through fetch(); the service worker's stale-while-revalidate handler
   stores each response in DATA_CACHE so the whole featured-poets subset
   works fully offline thereafter.

   Source of truth for "is this offline?" is the Cache Storage API itself
   (not a localStorage flag), so a sw.js version bump that wipes the cache
   is detected on next mount instead of lying "done" forever.

   We don't probe every poem URL on mount (17K cache lookups would be
   slow); we sample each poet's _index.json as a sentinel — if cached,
   that poet's subtree is assumed cached too. Real ground truth is
   re-established by re-tapping the Save button (worst case re-fetches
   what's already cached, which is cheap with stale-while-revalidate).
   ──────────────────────────────────────────────────────────────────── */
function OfflineCache() {
  const [state, setState] = useState('checking');     // checking | idle | partial | done | downloading
  const [urls, setUrls] = useState(null);             // flat list of all URLs to fetch
  const [poetCounts, setPoetCounts] = useState(null); // {slug: poemCount}
  const [presentPoets, setPresentPoets] = useState(0);// # of poets whose _index.json sentinel is cached
  const [progress, setProgress] = useState(0);
  const [failedUrls, setFailedUrls] = useState([]);   // URLs that failed in the last attempt (in-session)
  const [currentPoet, setCurrentPoet] = useState('');
  const [storageBytes, setStorageBytes] = useState(null); // total bytes used by this origin (caches + everything)

  // Poll storage estimate while a download is in flight so the user
  // sees the number grow. We rely on navigator.storage.estimate(),
  // which returns total origin usage (shell + runtime + data caches +
  // localStorage). That's the right number to show — it's what iOS
  // counts against the PWA's storage budget.
  useEffect(() => {
    if (state !== 'downloading' || !navigator.storage?.estimate) return;
    let alive = true;
    const tick = async () => {
      try {
        const est = await navigator.storage.estimate();
        if (alive) setStorageBytes(est.usage ?? null);
      } catch {}
    };
    tick();
    const id = setInterval(tick, 2000);
    return () => { alive = false; clearInterval(id); };
  }, [state]);

  // Mount: load poet indexes, enumerate URLs, check sentinels.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      // fetchJson hits IDB first, so offline-saved indexes load instantly.
      // On network, they're cached in IDB for next time once downloadAll
      // has run; until then this still pays a network roundtrip per poet.
      const trees = await Promise.all(FAMOUS_POETS.map(slug =>
        fetchJson(`${DATA}/${slug}/_index.json`).catch(() => null)
      ));
      if (cancelled) return;

      const all = [];
      const counts = {};
      for (let i = 0; i < FAMOUS_POETS.length; i++) {
        const slug = FAMOUS_POETS[i];
        const tree = trees[i];
        if (!tree) continue;
        const poems = enumeratePoemUrls(slug, tree.tree);
        counts[slug] = poems.length;
        all.push(`${DATA}/${slug}/_index.json`);
        all.push(`${DATA}/${slug}/_search.json`);
        for (const u of poems) all.push(u);
      }
      setUrls(all);
      setPoetCounts(counts);

      // Sentinel scan: just check the 8 _index.json keys in IDB. getKey
      // is one B-tree probe per call so this is effectively free even if
      // the store holds all 17K poem entries.
      const presentByPoet = await Promise.all(FAMOUS_POETS.map(slug =>
        idbHas(`${slug}/_index.json`).catch(() => false)
      ));
      if (cancelled) return;
      const present = presentByPoet.filter(Boolean).length;
      setPresentPoets(present);
      setState(present === FAMOUS_POETS.length ? 'done' : present === 0 ? 'idle' : 'partial');
      if (navigator.storage?.estimate) {
        try {
          const est = await navigator.storage.estimate();
          if (!cancelled) setStorageBytes(est.usage ?? null);
        } catch {}
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Per-URL retry with exponential backoff. Cloudflare (in front of GH Pages)
  // will 429/503 if you fire thousands of requests in rapid succession, so a
  // failed fetch is almost always transient — wait and retry rather than give
  // up on the entry. Writes the response body to IDB on success; subsequent
  // re-runs short-circuit on already-stored keys so retries are cheap.
  async function fetchAndStore(url) {
    const key = urlToIdbKey(url);
    if (await idbHas(key)) return true;
    const delays = [600, 1800, 4000]; // ms before retry attempt 2, 3, 4
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const text = await r.text();
        await idbPut(key, text);
        return true;
      } catch {
        if (attempt === delays.length) return false;
        await new Promise(res => setTimeout(res, delays[attempt] + Math.random() * 400));
      }
    }
    return false;
  }

  async function downloadAll() {
    if (!urls) return;
    setState('downloading');
    setProgress(0);
    // Resume mode: if we have a known failed list, only retry those.
    // Otherwise download everything — fetchAndStore short-circuits on
    // keys that are already in IDB, so re-running over a full list is
    // cheap when most entries are saved already.
    const queue = failedUrls.length > 0 ? [...failedUrls] : [...urls];
    const newFailures = [];
    let done = 0, idx = 0;
    // Concurrency 6: matches the per-host TCP cap iOS Safari already enforces,
    // and keeps us well below the rate iOS Safari historically tips Cloudflare
    // into 429s under sustained load.
    const CONCURRENCY = 6;
    async function worker() {
      while (true) {
        const i = idx++;
        if (i >= queue.length) break;
        const url = queue[i];
        const ok = await fetchAndStore(url);
        if (!ok) newFailures.push(url);
        done++;
        if (done % 25 === 0 || done === queue.length) {
          setProgress(done);
          const m = url.match(/data\/([^/]+)\//);
          if (m) setCurrentPoet(m[1]);
        }
      }
    }
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    setProgress(done);
    setFailedUrls(newFailures);
    // Re-check sentinels against IDB so the headline reflects reality.
    const presentByPoet = await Promise.all(FAMOUS_POETS.map(slug =>
      idbHas(`${slug}/_index.json`).catch(() => false)
    ));
    setPresentPoets(presentByPoet.filter(Boolean).length);
    setState(newFailures.length === 0 ? 'done' : 'partial');
    // Final storage refresh — the polling interval clears as soon as
    // state leaves 'downloading', so the last sample might be a couple
    // of seconds stale. One more read after the queue drains.
    if (navigator.storage?.estimate) {
      try {
        const est = await navigator.storage.estimate();
        setStorageBytes(est.usage ?? null);
      } catch {}
    }
  }

  // Render --------------------------------------------------------------
  if (state === 'checking' || !urls) {
    return <p className="muted text-sm">در حال بررسی…</p>;
  }

  const TOTAL = urls.length;
  const totalPoems = poetCounts
    ? Object.values(poetCounts).reduce((a, b) => a + b, 0)
    : 0;

  if (state === 'downloading') {
    const queueSize = failedUrls.length > 0 ? failedUrls.length : TOTAL;
    const pct = Math.round((progress / Math.max(1, queueSize)) * 100);
    return (
      <div className="space-y-2">
        <p className="text-sm">
          در حال دانلود… {toPersianDigits(progress.toLocaleString('fa-IR'))} / {toPersianDigits(queueSize.toLocaleString('fa-IR'))}
        </p>
        <div className="h-1.5 surface-2 rounded overflow-hidden">
          <div className="h-full accent-bg" style={{ width: `${pct}%`, transition: 'width 0.2s' }} />
        </div>
        {currentPoet && (
          <p className="muted text-xs">شاعر فعلی: {currentPoet}</p>
        )}
        {storageBytes != null && (
          <p className="muted text-xs">حافظهٔ مصرف‌شده: {formatBytesFa(storageBytes)}</p>
        )}
      </div>
    );
  }

  if (state === 'done') {
    return (
      <div className="space-y-2">
        <p className="text-sm">
          ✓ همهٔ {toPersianDigits(FAMOUS_POETS.length)} شاعر برجسته (~{toPersianDigits(totalPoems.toLocaleString('fa-IR'))} شعر) برای استفادهٔ آفلاین ذخیره شد.
        </p>
        {storageBytes != null && (
          <p className="muted text-xs">حافظهٔ مصرف‌شده: {formatBytesFa(storageBytes)}</p>
        )}
        <button onClick={downloadAll} className="muted text-xs underline active:opacity-60">
          دانلود مجدد
        </button>
      </div>
    );
  }

  if (state === 'partial') {
    // Two distinct sub-states the user might land in:
    //   A) We have a known failed-URL list from this session — retry only those.
    //   B) No failure list, but the mount-time sentinel scan showed fewer than 8
    //      poets cached — fresh "save remaining" flow.
    if (failedUrls.length > 0) {
      const n = failedUrls.length.toLocaleString('fa-IR');
      return (
        <div className="space-y-2">
          <p className="text-sm">
            {toPersianDigits(n)} شعر هنوز ذخیره نشده — احتمالاً اتصال یا محدودیت سرور مانع شد.
          </p>
          {storageBytes != null && (
            <p className="muted text-xs">حافظهٔ مصرف‌شده: {formatBytesFa(storageBytes)}</p>
          )}
          <button
            onClick={downloadAll}
            className="accent-bg text-white px-4 py-2 rounded-lg text-sm font-medium"
          >
            تلاش مجدد برای {toPersianDigits(n)} مورد
          </button>
        </div>
      );
    }
    const remainingPoets = FAMOUS_POETS.length - presentPoets;
    return (
      <div className="space-y-2">
        <p className="text-sm">
          {toPersianDigits(presentPoets)} از {toPersianDigits(FAMOUS_POETS.length)} شاعر ذخیره شده است.
        </p>
        {storageBytes != null && (
          <p className="muted text-xs">حافظهٔ مصرف‌شده: {formatBytesFa(storageBytes)}</p>
        )}
        <button
          onClick={downloadAll}
          className="accent-bg text-white px-4 py-2 rounded-lg text-sm font-medium"
        >
          ذخیرهٔ {toPersianDigits(remainingPoets)} شاعر باقی‌مانده
        </button>
      </div>
    );
  }

  // 'idle'
  return (
    <div className="space-y-2">
      <button
        onClick={downloadAll}
        className="accent-bg text-white px-4 py-2 rounded-lg text-sm font-medium"
      >
        ذخیرهٔ آفلاین ۸ شاعر برجسته
      </button>
      <p className="muted text-xs leading-6">
        دانلود همهٔ شعرهای حافظ، سعدی، مولانا، خیام، فردوسی، عطار، سنایی و نظامی
        ({toPersianDigits(totalPoems.toLocaleString('fa-IR'))} شعر، تقریباً ۲۵۰ مگابایت).
        پس از ذخیره، خواندن این شاعران بدون اینترنت ممکن خواهد بود. توصیه می‌شود
        روی شبکهٔ وای‌فای انجام دهید.
      </p>
      {storageBytes != null && (
        <p className="muted text-xs">حافظهٔ مصرف‌شده: {formatBytesFa(storageBytes)}</p>
      )}
    </div>
  );
}

function Section({ title, children }) {

    <div>
      <h2 className="text-xs font-semibold muted mb-2 px-1">{title}</h2>
      <div className="surface border border-soft rounded-2xl p-3">{children}</div>

}
function Picker({ options, value, onChange }) {
  return (

        <button

          onClick={() => onChange(o.id)}

}
