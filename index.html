const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================================
   PERSIAN TEXT NORMALIZATION
   Two-layer model per the blueprint:
   - toDisplay: NFC + Arabic→Persian yeh/kaf, strip bidi
   - toSearch:  aggressive, used both at index time and query time
   ========================================================================= */
const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const TO_FA = { 'ي': 'ی', 'ك': 'ک', 'ى': 'ی', 'ة': 'ه', 'ہ': 'ه' };
const DIAC = /[\u064B-\u0652\u0670\u0640\u0654\u0655]/g;
const BIDI = /[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g;

function toDisplay(s) {
  return (s || '').normalize('NFC')
    .replace(/[يكىةہ]/g, c => TO_FA[c] || c)
    .replace(BIDI, '');
}
function toSearch(s) {
  let x = toDisplay(s).replace(DIAC, '')
    .replace(/[آأإ]/g, 'ا')
    .replace(/[ؤئء]/g, '')
    .replace(/[\u200C\u200D]/g, ' ');
  for (let i = 0; i < 10; i++) {
    x = x.replace(new RegExp(FA_DIGITS[i], 'g'), String(i));
    x = x.replace(new RegExp(AR_DIGITS[i], 'g'), String(i));
  }
  return x.toLowerCase().replace(/\s+/g, ' ').trim();
}
function detectArabicChars(s) {
  return /[يكىةأإؤئ]/.test(s || '');
}

/* Catalog stub: full 495-ghazal list shown as numbered placeholders.
   The 2 we have real data for are flagged hasData. */
const HAFEZ_GHAZAL_COUNT = 495;
const POEMS_BY_NUMBER = Object.fromEntries(POEMS.map(p => [p.number, p]));

/* =========================================================================
   THEMES, FONTS, SETTINGS
   ========================================================================= */
const THEMES = [
  { id: 'sepia', label: 'کاهی', emoji: '📜' },
  { id: 'light', label: 'روشن', emoji: '☀️' },
  { id: 'dark',  label: 'تاریک', emoji: '🌙' },
];
const FONTS = [
  { id: 'vazir',   label: 'وزیرمتن', stack: "'Vazirmatn', system-ui, sans-serif" },
  { id: 'estedad', label: 'استعداد',  stack: "'Estedad', 'Vazirmatn', sans-serif" },
];
const FONT_SIZES = [
  { id: 'xs', label: 'ریز', cls: 'text-base' },
  { id: 'sm', label: 'کوچک', cls: 'text-lg' },
  { id: 'md', label: 'متوسط', cls: 'text-xl' },
  { id: 'lg', label: 'بزرگ', cls: 'text-2xl' },
  { id: 'xl', label: 'درشت', cls: 'text-3xl' },
];

/* =========================================================================
   COMPONENTS
   ========================================================================= */

function App() {
  const [theme, setTheme] = useState('sepia');
  const [font, setFont] = useState('vazir');
  const [fontSize, setFontSize] = useState('md');
  const [tab, setTab] = useState('home');      // home | library | search | settings
  const [openPoem, setOpenPoem] = useState(null);
  const [favorites, setFavorites] = useState(new Set());

  useEffect(() => {
    document.body.className = `theme-${theme}`;
    document.body.style.fontFamily = FONTS.find(f => f.id === font).stack;
  }, [theme, font]);

  const toggleFav = (id) => {
    setFavorites(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };

  const settingsProps = { theme, setTheme, font, setFont, fontSize, setFontSize };

  return (
    <div className="min-h-full flex flex-col">
      <TopBar tab={tab} onSearch={() => setTab('search')} onSettings={() => setTab('settings')} />
      <main className="flex-1 overflow-y-auto pb-24">
        {openPoem ? (
          <Reader
            poem={openPoem}
            fontSize={fontSize}
            onClose={() => setOpenPoem(null)}
            isFav={favorites.has(openPoem.id)}
            onFav={() => toggleFav(openPoem.id)}
          />
        ) : tab === 'home' ? (
          <Home onOpenPoem={setOpenPoem} onTab={setTab} />
        ) : tab === 'library' ? (
          <Library onOpenPoem={setOpenPoem} />
        ) : tab === 'search' ? (
          <Search onOpenPoem={setOpenPoem} />
        ) : (
          <Settings {...settingsProps} favCount={favorites.size} />
        )}
      </main>
      {!openPoem && <BottomNav tab={tab} setTab={setTab} />}
    </div>
  );
}

function TopBar({ tab, onSearch, onSettings }) {

    <header className="surface border-b border-soft pt-safe">
      <div className="flex items-center justify-between px-4 py-3">
        <button onClick={onSettings} className="text-2xl muted active:opacity-50">⚙</button>
        <h1 className="text-lg font-semibold">{titles[tab]}</h1>
        <button onClick={onSearch} className="text-2xl muted active:opacity-50">🔍</button>
      </div>
    </header>
  );
}

        <p className="muted text-sm mt-1">{POET.name_full_fa}</p>
      </section>

      {/* faal card */}
      <section className="px-4">
        <button
          onClick={faal}

        <QuickLink label="جست‌وجو" sub="در متن همه" emoji="🔎" onClick={() => onTab('search')} />
      </section>

      {/* about */}
      <section className="px-5 mt-7">
        <h3 className="text-sm font-semibold mb-2">دربارهٔ این پروژه</h3>

          گنجور-جیب یک آرشیو متن‌باز از شعر کلاسیک پارسی است، بر پایهٔ دادهٔ <span className="accent">ganjoor.net</span>،
          با هدفی روشن: زیرساختی پایدار و قابل ارجاع برای پروژه‌های آینده.
          کد متن‌باز (MIT)، داده تحت CC-BY-4.0.
        </p>
      </section>

      <section className="px-5 mt-5 mb-8">
        <p className="muted text-xs">
          منبع داده: <a className="accent underline" href="https://ganjoor.net">گنجور</a> · حبیب هادیان‌فرد و همکاران
        </p>
      </section>
    </div>
  );
}

function QuickLink({ label, sub, emoji, onClick }) {
  return (
    <button onClick={onClick} className="surface border border-soft rounded-2xl p-4 text-right active:opacity-80">
      <div className="text-2xl mb-1">{emoji}</div>
      <p className="font-semibold text-sm">{label}</p>
      <p className="muted text-xs mt-0.5">{sub}</p>
    </button>
  );
}

function Library({ onOpenPoem }) {
  const items = Array.from({ length: HAFEZ_GHAZAL_COUNT }, (_, i) => i + 1);
  const [q, setQ] = useState('');
  const filtered = useMemo(() => {
    if (!q.trim()) return items;
    const n = parseInt(toSearch(q), 10);
    if (Number.isFinite(n)) return items.filter(i => String(i).includes(String(n)));
    return items;
  }, [q]);

  return (
    <div className="fade-in">
      <div className="px-4 pt-4 pb-2 sticky top-0 surface/95 backdrop-blur z-10">
        <div className="surface-2 rounded-xl px-3 py-2 flex items-center gap-2">
          <span className="muted">#</span>
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            inputMode="numeric"
            placeholder="شمارهٔ غزل…"
            className="bg-transparent outline-none flex-1 text-base"
          />
        </div>
      </div>
      <div className="px-3 pb-4">
        <div className="grid grid-cols-4 gap-2 mt-2">
          {filtered.map(n => {
            const p = POEMS_BY_NUMBER[n];
            const has = !!p;
            return (
              <button
                key={n}
                disabled={!has}
                onClick={() => has && onOpenPoem(p)}
                className={`aspect-square rounded-xl border border-soft flex flex-col items-center justify-center
                  ${has ? 'surface active:opacity-70' : 'surface-2 opacity-40'}`}
              >
                <span className={`text-xl font-bold ${has ? 'accent' : 'muted'}`}>{toPersianDigits(n)}</span>
                {has && <span className="muted text-[10px] mt-0.5">●</span>}
              </button>
            );
          })}
        </div>
        <p className="muted text-xs text-center mt-4 px-6 leading-6">
          در این نمونه فقط دو غزل (۸۱ و ۱۰۸) داده دارند.
          در نسخهٔ کامل، هر ۴۹۵ غزل از طریق نشانی پایدار قابل دسترسی خواهد بود.
        </p>
      </div>
    </div>
  );
}

function toPersianDigits(n) {
  return String(n).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}

function Reader({ poem, fontSize, onClose, isFav, onFav }) {
  const sizeCls = FONT_SIZES.find(s => s.id === fontSize).cls;
  const beyts = [];
  for (let i = 0; i < poem.verses.length; i += 2) {
    beyts.push([poem.verses[i], poem.verses[i + 1]]);
  }
  return (
    <div className="fade-in pb-12">
      {/* reader header */}
      <header className="px-4 py-3 flex items-center justify-between border-b border-soft surface sticky top-0 z-10">
        <button onClick={onClose} className="text-2xl active:opacity-50">→</button>
        <div className="text-center flex-1 mx-3 truncate">
          <p className="text-xs muted">{POET.name_fa} · {poem.category_fa}</p>
          <p className="text-sm font-semibold">{poem.title}</p>
        </div>
        <button onClick={onFav} className="text-2xl active:opacity-50">
          {isFav ? '★' : '☆'}
        </button>
      </header>

      {/* poem body */}
      <article className="px-4 py-6">
        <div className="ornament my-4">۞</div>

        {beyts.map((pair, idx) => (
          <div key={idx} className="my-4">
            <div className="beyt-grid beyt">
              <p className={`mesra-1 ${sizeCls}`}>{toDisplay(pair[0].text)}</p>
              <span className="beyt-sep muted text-xs">۞</span>
              <p className={`mesra-2 ${sizeCls}`}>{pair[1] ? toDisplay(pair[1].text) : ''}</p>
            </div>
          </div>
        ))}

        <div className="ornament mt-6 mb-4">۞</div>

        {/* metadata card */}
        <div className="surface-2 rounded-xl p-4 mt-6 text-sm space-y-2">
          <Row k="وزن" v={poem.meter_fa} />
          <Row k="قافیه" v={poem.rhyme} />
          <Row k="قالب" v="غزل" />
          <Row k="تعداد ابیات" v={toPersianDigits(beyts.length)} />
          <Row k="نشانی پایدار" v={poem.urn} mono />
          <Row k="منبع" v="گنجور · ganjoor.net" />
        </div>

        {/* share actions */}
        <div className="flex gap-2 mt-4">
          <ActionBtn label="هم‌رسانی" emoji="↗" />
          <ActionBtn label="کارت تصویر" emoji="🖼" />
          <ActionBtn label="پیوند" emoji="🔗" />
        </div>
      </article>
    </div>
  );
}

function Row({ k, v, mono }) {
  return (
    <div className="flex items-start justify-between gap-3">
      <span className="muted shrink-0">{k}</span>
      <span className={`text-end ${mono ? 'font-mono text-xs' : ''}`}>{v}</span>
    </div>
  );
}

function ActionBtn({ label, emoji }) {
  return (
    <button className="surface border border-soft rounded-xl px-3 py-2 text-sm flex-1 active:opacity-70">
      <span className="ml-1">{emoji}</span> {label}
    </button>
  );
}

function Search({ onOpenPoem }) {
  const [q, setQ] = useState('');
  const hasArabic = detectArabicChars(q);

  // Build a flat verse index from POEMS
  const index = useMemo(() => {
    const out = [];
    POEMS.forEach(p => {
      for (let i = 0; i < p.verses.length; i += 2) {
        const m1 = p.verses[i], m2 = p.verses[i + 1];
        const display = m2 ? `${m1.text} · ${m2.text}` : m1.text;
        const search = toSearch(`${m1.text} ${m2 ? m2.text : ''}`);
        out.push({ poem: p, beyt_index: i / 2 + 1, display, search });
      }
    });
    return out;
  }, []);

  const results = useMemo(() => {
    const needle = toSearch(q);
    if (!needle || needle.length < 2) return [];
    return index.filter(r => r.search.includes(needle)).slice(0, 50);
  }, [q, index]);

  return (
    <div className="fade-in">
      <div className="px-4 pt-4">
        <div className="surface-2 rounded-xl px-3 py-3 flex items-center gap-2">
          <span className="muted">🔎</span>
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="جست‌وجو در ابیات…"
            className="bg-transparent outline-none flex-1 text-base"
            autoFocus
          />
          {q && <button onClick={() => setQ('')} className="muted text-xl">×</button>}
        </div>

        {hasArabic && (
          <div className="mt-3 surface-2 border border-soft rounded-xl px-3 py-2 text-xs">
            <span className="muted">حروف عربی به فارسی نگاشته شد: </span>
            <span className="accent font-mono">{toDisplay(q)}</span>
          </div>
        )}

        {q && !results.length && (
          <p className="muted text-sm text-center mt-8">
            موردی یافت نشد. سعی کنید بخشی از یک مصراع را وارد کنید.
          </p>
        )}

        {!q && (
          <div className="mt-6">
            <p className="muted text-xs mb-2 px-1">جست‌وجوی نمونه</p>
            <div className="flex flex-wrap gap-2">
              {['عشق', 'صبحدم', 'گل', 'فلک', 'ساقی'].map(s => (
                <button
                  key={s}
                  onClick={() => setQ(s)}
                  className="surface border border-soft rounded-full px-3 py-1.5 text-sm active:opacity-70"
                >{s}</button>
              ))}
            </div>
            <div className="mt-6 surface-2 border border-soft rounded-xl p-4 text-xs leading-7">
              <p className="font-semibold mb-1">یادداشت</p>
              <p className="muted">
                این جست‌وجو با نرمال‌سازی فارسی کار می‌کند: ي/ی، ك/ک، نیم‌فاصله، اعراب و ارقام،
                همه به‌صورت یکپارچه دیده می‌شوند. در نسخهٔ کامل، فهرستِ SQLite + FTS5
                از طریق Range request میلیون‌ها بیت را در گوشی جست‌وجو خواهد کرد.
              </p>
            </div>
          </div>
        )}

        {results.length > 0 && (
          <div className="mt-4 space-y-2 pb-6">
            <p className="muted text-xs px-1">{toPersianDigits(results.length)} نتیجه</p>
            {results.map((r, i) => (
              <button
                key={i}
                onClick={() => onOpenPoem(r.poem)}
                className="w-full surface border border-soft rounded-xl p-3 text-right active:opacity-70"
              >
                <p className="muted text-[11px] mb-1">{r.poem.title} · بیت {toPersianDigits(r.beyt_index)}</p>
                <p className="text-sm leading-7">
                  {highlight(r.display, q)}
                </p>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function highlight(text, q) {
  if (!q) return text;
  const needle = toSearch(q);
  if (!needle) return text;
  // naive highlighting: find substrings whose normalized form includes the needle
  const words = text.split(/(\s+)/);
  return words.map((w, i) => {
    if (toSearch(w).includes(needle)) {
      return <mark key={i} className="accent-bg text-white rounded px-0.5">{w}</mark>;
    }
    return <span key={i}>{w}</span>;
  });
}

function Settings({ theme, setTheme, font, setFont, fontSize, setFontSize, favCount }) {
  return (
    <div className="fade-in px-4 pt-4 pb-8 space-y-5">
      <Section title="ظاهر">
        <Picker
          options={THEMES.map(t => ({ id: t.id, label: `${t.emoji}  ${t.label}` }))}
          value={theme}
          onChange={setTheme}
        />
      </Section>

      <Section title="قلم">
        <Picker
          options={FONTS.map(f => ({ id: f.id, label: f.label }))}
          value={font}
          onChange={setFont}
        />
      </Section>

      <Section title="اندازهٔ متن">
        <Picker
          options={FONT_SIZES.map(s => ({ id: s.id, label: s.label }))}
          value={fontSize}
          onChange={setFontSize}
        />
      </Section>

      <Section title="کتابخانهٔ شخصی">
        <p className="muted text-sm">شعرهای نشان‌شده: {toPersianDigits(favCount)}</p>
      </Section>

      <Section title="دربارهٔ پروژه">
        <div className="text-sm leading-7 space-y-2">
          <p>گنجور-جیب · نسخهٔ ۰٫۱</p>
          <p className="muted">
            متن‌باز تحت MIT؛ دادهٔ متنی تحت CC-BY-4.0 بر پایهٔ ganjoor.net.
          </p>
          <p className="muted">
            با احترام و سپاس از حبیب هادیان‌فرد و همکاران گنجور.
          </p>
        </div>
      </Section>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div>
      <h2 className="text-xs font-semibold muted mb-2 px-1">{title}</h2>
      <div className="surface border border-soft rounded-2xl p-3">{children}</div>
    </div>
  );
}

function Picker({ options, value, onChange }) {
  return (
    <div className="flex gap-1.5 flex-wrap">
      {options.map(o => (
        <button
          key={o.id}
          onClick={() => onChange(o.id)}
          className={`px-3 py-2 rounded-lg text-sm border transition flex-1 min-w-[5rem]
            ${value === o.id ? 'accent-bg text-white border-transparent' : 'border-soft surface-2'}`}
        >
          {o.label}
        </button>
      ))}
    </div>
  );
}

function BottomNav({ tab, setTab }) {
  const items = [
    { id: 'home',     label: 'خانه',    emoji: '🏠' },
    { id: 'library',  label: 'دیوان',   emoji: '📖' },
    { id: 'search',   label: 'جست‌وجو', emoji: '🔍' },
    { id: 'settings', label: 'تنظیمات', emoji: '⚙' },
  ];
  return (
    <nav className="surface border-t border-soft fixed bottom-0 inset-x-0 pb-safe z-20">
      <div className="grid grid-cols-4">
        {items.map(it => (
          <button
            key={it.id}
            onClick={() => setTab(it.id)}
            className={`py-3 flex flex-col items-center gap-0.5 text-xs ${tab === it.id ? 'accent' : 'muted'}`}
          >
            <span className="text-xl">{it.emoji}</span>
            <span>{it.label}</span>
          </button>
        ))}
      </div>
    </nav>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
